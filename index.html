<!DOCTYPE html>
<html>
<head>
    <style>
        /* Light, Clean User Theme */
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; padding: 50px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #2c3e50; }
        button { background: #3498db; color: white; padding: 15px 30px; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Member Portal</h1>
        <button onclick="check()">Refresh Library Data</button>
        <div id="output" style="margin-top:25px;"></div>
    </div>
    <script>
        async function check() {
            const res = await fetch('http://localhost:3000/api/books');
            const data = await res.json();
            document.getElementById('output').innerHTML = data.map(b => 
                `<div style="padding:10px; border-bottom:1px solid #eee;">${b.title} - <b>${b.status}</b></div>`).join('');
        }
    </script>
</body>
</html>
