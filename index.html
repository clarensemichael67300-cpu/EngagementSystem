<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        .hidden { display: none; }
        h1 { color: #2c3e50; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .link { color: #3498db; cursor: pointer; text-align: center; display: block; margin-top: 15px; font-size: 0.9em; }
        .badge { padding: 5px 10px; border-radius: 5px; color: white; font-size: 0.85em; }
    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <h1><i class="fas fa-lock"></i> Login</h1>
        <input type="text" id="l-user" placeholder="Username">
        <input type="password" id="l-pass" placeholder="Password">
        <button onclick="login()">Enter Portal</button>
        <span class="link" onclick="toggleViews()">Don't have an account? Sign Up</span>
    </div>

    <div id="signup-screen" class="container hidden">
        <h1><i class="fas fa-user-plus"></i> Create Account</h1>
        <input type="text" id="s-name" placeholder="Full Name">
        <input type="number" id="s-age" placeholder="Age">
        <input type="text" id="s-id" placeholder="ID Number">
        
        <select id="s-course">
            <option value="" disabled selected>Select your Course</option>
            <option value="BSIT (PROGRAMMING)">BSIT (PROGRAMMING)</option>
            <option value="BSINDU (ELECTRICAL)">BSINDU (ELECTRICAL)</option>
            <option value="BSINDU (AUTOMOTIVE)">BSINDU (AUTOMOTIVE)</option>
            <option value="BSINDU (ELECTRONICS)">BSINDU (ELECTRONICS)</option>
            <option value="BSMA">BSMA</option>
            <option value="BSA">BSA</option>
            <option value="BTLED">BTLED</option>
            <option value="BSED">BSED</option>
        </select>

        <select id="s-year">
            <option value="" disabled selected>Select your Year Level</option>
            <option value="1st">1st Year</option>
            <option value="2nd">2nd Year</option>
            <option value="3rd">3rd Year</option>
            <option value="4th">4th Year</option>
        </select>

        <input type="password" id="s-pass" placeholder="Password">
        <button onclick="signUp()">Register</button>
        <span class="link" onclick="toggleViews()">Already have an account? Login</span>
    </div>

    <div id="dashboard" class="container hidden">
        <div style="position: absolute; top: 20px; right: 20px;">
            <button onclick="location.reload()" style="background:transparent; color:#e74c3c; border:1px solid #e74c3c; padding: 5px 10px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <h1><i class="fas fa-book-reader"></i> Available Library</h1>
        <p>Welcome, <span id="user-display" style="font-weight:bold;"></span>!</p>
        <input type="text" id="search" placeholder="🔍 Search books..." onkeyup="filterBooks()">
        <ul id="book-list" style="list-style:none; padding:0; margin-top: 20px;"></ul>
    </div>

    <script>
        function toggleViews() {
            document.getElementById('login-screen').classList.toggle('hidden');
            document.getElementById('signup-screen').classList.toggle('hidden');
        }

        function login() {
            const user = document.getElementById('l-user').value;
            if(user) {
                document.getElementById('user-display').innerText = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadBooks();
            }
        }

        async function loadBooks() {
            const res = await fetch('http://localhost:3000/api/books');
            const books = await res.json();
            const list = document.getElementById('book-list');
            list.innerHTML = books.map(b => `
                <li style="padding:15px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="fas fa-book"></i> ${b.title}</span>
                    ${b.status === 'Available' ? 
                        `<button onclick="borrowBook(${b.id})" style="width:auto; padding:5px 15px; background:#27ae60;">Borrow</button>` : 
                        `<span class="badge" style="background:#c0392b;">Borrowed</span>`
                    }
                </li>`).join('');
        }

        async function borrowBook(id) {
            const res = await fetch(`http://localhost:3000/api/borrow/${id}`, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                alert("Book successfully borrowed!");
                loadBooks();
            } else {
                alert("Error: " + data.message);
            }
        }

        function filterBooks() {
            const query = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#book-list li').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function signUp() {
            const name = document.getElementById('s-name').value;
            if(name) {
                alert("Registration successful for " + name + "!");
                toggleViews();
            }
        }
    </script>
</body>
</html>
