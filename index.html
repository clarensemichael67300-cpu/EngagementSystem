<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Engagement System | Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        h1 { color: #2c3e50; text-align: center; font-size: 22px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background: #2980b9; }
        .hidden { display: none; }
        .link-text { text-align: center; margin-top: 15px; font-size: 14px; color: #7f8c8d; }
        .link-text a { color: #3498db; text-decoration: none; cursor: pointer; font-weight: bold; }
        .book-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .search-bar { border: 2px solid #3498db; }
        .nav-icons { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; }
    </style>
</head>
<body>

    <div id="login-view" class="container">
        <h1>Engagement Portal</h1>
        <input type="text" id="login-user" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="link-text">Don't have an account? <a onclick="toggleView('signup-view')">Sign Up</a></div>
    </div>

    <div id="signup-view" class="container hidden">
        <h1>Create Account</h1>
        <input type="text" placeholder="Full Name">
        <input type="text" placeholder="ID Number">
        <input type="text" placeholder="Desired Username">
        <input type="password" placeholder="Create Password">
        <select><option disabled selected>Select Course</option><option>BSIT (PROGRAMMING)</option><option>BSINDU (ELECTRICAL)</option><option>BSINDU (AUTOMOTIVE)</option><option>BSINDU (ELECTRONICS)</option><option>BTLED</option><option>BSED</option><option>BSMA</option><option>BSA</option></select>
        <select><option disabled selected>Year Level</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
        <select><option disabled selected>Section</option><option>Section A</option><option>Section B</option><option>Section C</option><option>Section D</option><option>Section E</option></select>
        <button onclick="alert('Account Created Successfully!'); toggleView('login-view');">Register Now</button>
        <div class="link-text"><a onclick="toggleView('login-view')">Back to Login</a></div>
    </div>

    <div id="dashboard-view" class="container hidden" style="max-width: 700px;">
        <div class="nav-icons">
            <i class="fas fa-cog" style="cursor: pointer; color: #3498db; font-size: 20px;" onclick="toggleView('settings-view')" title="Account Settings"></i>
            <i class="fas fa-sign-out-alt" style="cursor: pointer; color: #e74c3c; font-size: 20px;" onclick="handleLogout()" title="Logout"></i>
        </div>
        <h1>Library Catalog</h1>
        <input type="text" id="search-bar" class="search-bar" placeholder="Search by title or author..." onkeyup="filterBooks()">
        <div id="book-list" style="margin-top: 20px;"></div>
    </div>

    <div id="settings-view" class="container hidden">
        <h1>Account Settings</h1>
        <input type="text" id="edit-name" placeholder="New Full Name">
        <input type="text" id="edit-id" placeholder="New ID Number">
        <select id="edit-year"><option disabled selected>Select Year Level</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
        <select id="edit-section"><option disabled selected>Select Section</option><option>Section A</option><option>Section B</option><option>Section C</option><option>Section D</option><option>Section E</option></select>
        <input type="password" id="confirm-pass" placeholder="Confirm Password">
        <button onclick="saveSettings()">Save Changes</button>
        <button style="background:#7f8c8d;" onclick="toggleView('dashboard-view')">Back</button>
    </div>

    <script>

        let allBooks = [];
    
        // =========================================
        // CHECK LOGIN
        // =========================================
    
        (function checkLogin() {
    
            if (localStorage.getItem('isLoggedIn') === 'true') {
    
                document.getElementById('login-view')
                    .classList.add('hidden');
    
                document.getElementById('dashboard-view')
                    .classList.remove('hidden');
    
                loadAvailableBooks();
            }
    
        })();
    
        // =========================================
        // TOGGLE VIEW
        // =========================================
    
        function toggleView(viewId) {
    
            document.querySelectorAll('.container')
                .forEach(div => div.classList.add('hidden'));
    
            document.getElementById(viewId)
                .classList.remove('hidden');
    
            if (viewId === 'dashboard-view') {
    
                loadAvailableBooks();
            }
        }
    
        // =========================================
        // LOGIN
        // =========================================
    
        async function login() {
    
            const username =
                document.getElementById('login-user').value;
    
            const password =
                document.getElementById('login-pass').value;
    
            if (username && password) {
    
                // SAVE USERNAME
                localStorage.setItem(
                    'loggedInUser',
                    username
                );
    
                // SAVE LOGIN STATUS
                localStorage.setItem(
                    'isLoggedIn',
                    'true'
                );
    
                console.log(
                    "LOGGED IN USER:",
                    username
                );
    
                toggleView('dashboard-view');
    
            } else {
    
                alert("Please enter credentials.");
            }
        }
    
        // =========================================
        // LOGOUT
        // =========================================
    
        function handleLogout() {
    
            if (confirm("Are you sure you want to log out?")) {
    
                localStorage.removeItem('isLoggedIn');
    
                localStorage.removeItem('loggedInUser');
    
                location.reload();
            }
        }
    
        // =========================================
        // LOAD BOOKS
        // =========================================
    
        async function loadAvailableBooks() {
    
            try {
    
                const res =
                    await fetch('http://localhost:3000/api/books');
    
                allBooks = await res.json();
    
                console.log("BOOKS:", allBooks);
    
                renderBooks(allBooks);
    
            } catch (err) {
    
                console.error(err);
    
                document.getElementById('book-list').innerHTML =
                    "<p>Connection error to library database.</p>";
            }
        }
    
        // =========================================
        // BORROW BOOK
        // =========================================
    
        async function borrowBook(title) {
    
            // GET SAVED USERNAME
            const username =
                localStorage.getItem('loggedInUser');
    
            console.log("USERNAME:", username);
    
            console.log("BOOK TITLE:", title);
    
            // VALIDATION
            if (!username || !title) {
    
                alert("Missing username or book title");
    
                return;
            }
    
            try {
    
                const res = await fetch(
                    'http://localhost:3000/api/borrow',
                    {
                        method: 'POST',
    
                        headers: {
                            'Content-Type': 'application/json'
                        },
    
                        body: JSON.stringify({
    
                            username: username,
    
                            bookTitle: title
                        })
                    }
                );
    
                const data = await res.json();
    
                console.log("SERVER RESPONSE:", data);
    
                if (data.success) {
    
                    alert("Borrowed: " + title);
    
                    loadAvailableBooks();
    
                } else {
    
                    alert(data.message);
                }
    
            } catch (err) {
    
                console.error(err);
    
                alert("Connection error.");
            }
        }
    
        // =========================================
        // RENDER BOOKS
        // =========================================
    
        function renderBooks(books) {
    
            const list =
                document.getElementById('book-list');
    
            list.innerHTML = books.map(b => `
    
                <div class="book-item">
    
                    <div>
    
                        <strong>${b.title}</strong><br>
    
                        <small>
                            Author: ${b.author}
                            |
                            Stock: ${b.quantity}
                        </small>
    
                    </div>
    
                    <button
                        onclick="borrowBook('${b.title}')"
                        style="width:auto; margin:0;"
                    >
                        Borrow
                    </button>
    
                </div>
    
            `).join('');
        }
    
        // =========================================
        // SEARCH FILTER
        // =========================================
    
        function filterBooks() {
    
            const query =
                document.getElementById('search-bar')
                .value
                .toLowerCase();
    
            const filteredBooks = allBooks.filter(b =>
    
                b.title.toLowerCase().includes(query)
    
                ||
    
                b.author.toLowerCase().includes(query)
            );
    
            renderBooks(filteredBooks);
        }
    
        // =========================================
        // SAVE SETTINGS
        // =========================================
    
        function saveSettings() {
    
            if (
                document.getElementById('confirm-pass').value
                === "admin123"
            ) {
    
                alert("Profile updated successfully!");
    
                toggleView('dashboard-view');
    
            } else {
    
                alert("Incorrect password.");
            }
        }
    
    </script>
</body>
</html>
